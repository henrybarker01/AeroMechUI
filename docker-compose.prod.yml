# Production overrides: run with
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  web:
    # Not exposed publicly; Caddy proxies to it on the internal network
    ports: !override
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Trust X-Forwarded-Proto/For from Caddy so Secure cookies and redirects work
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    volumes:
      # Persist DataProtection keys so logins survive container recreation
      - dpkeys:/root/.aspnet/DataProtection-Keys

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  backup:
    build:
      context: .
      dockerfile: AeroMech.Backup/Dockerfile
    restart: unless-stopped
    environment:
      Backup__ConnectionString: "Host=db;Port=5432;Database=${POSTGRES_DB:-aeromech};Username=${POSTGRES_USER:-aeromech};Password=${POSTGRES_PASSWORD}"
      Backup__LocalBackupFolder: /backups
      Backup__BackupAtStartup: "true"
      Backup__RetentionDays: "14"
      # Worker schedules in UTC; 00:00 UTC = 02:00 SAST
      Backup__RunAtHour: "0"
      Backup__RunAtMinute: "0"
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

  # Syncs ./backups to OneDrive hourly. Requires ./rclone/rclone.conf with an
  # authorized "onedrive" remote (see deploy notes; create with `rclone config`).
  rclone:
    image: rclone/rclone:latest
    restart: unless-stopped
    volumes:
      - ./backups:/data:ro
      - ./rclone:/config/rclone
    entrypoint: /bin/sh
    command: >
      -c 'while true; do
            rclone copy /data onedrive:AeroMechBackups --min-age 2m --log-level INFO;
            rclone delete onedrive:AeroMechBackups --min-age 14d --log-level INFO;
            sleep 3600;
          done'
    depends_on:
      - backup

volumes:
  dpkeys:
  caddy_data:
  caddy_config:
